<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 4-minute anonymous survey by Greenwich Country Day School students, in partnership with L’Oréal Luxe.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Face Value · GCDS × L’Oréal Luxe">
<meta property="og:description" content="A 4-minute anonymous survey by Greenwich Country Day School students, in partnership with L’Oréal Luxe.">
<meta property="og:image" content="https://jacksonlieberman.me/facevalue/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="config.js"></script>
<title>Face Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap">
<style>
/* Layout: one question per screen in a centered 720px column. A thin bar under the
   header fills left to right through a skin-tone shade range as questions are answered. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --panel:#E9E7E2; --ink:#111214; --ink-2:#5C5E62; --line:#DCDCD7;
  --accent:#1D3557; --accent-ink:#FFFFFF; --tint:#E6EBF2; --metal:#A88B5C; --lip:#A85D55;
  --t1:#F1D3BE; --t2:#E2B597; --t3:#C98F6B; --t4:#A26B4A; --t5:#6E4630; --t6:#43291C;
  --serif:"Libre Caslon Display","Big Caslon","Didot",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1A1B1E; --panel:#1F2024; --ink:#F1F1EE; --ink-2:#A2A4A8; --line:#2E2F33;
    --accent:#9DB6D6; --accent-ink:#0D1420; --tint:#1C2533; --metal:#B79A6A; --lip:#C27A70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1A1B1E; --panel:#1F2024; --ink:#F1F1EE; --ink-2:#A2A4A8; --line:#2E2F33;
  --accent:#9DB6D6; --accent-ink:#0D1420; --tint:#1C2533; --metal:#B79A6A; --lip:#C27A70; color-scheme:dark;
}
html,body{margin:0;height:100%}
.app{min-height:100%;display:flex;flex-direction:column}
.app>main{flex:1 0 auto}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* illustration pigments */
.c-ink{fill:var(--ink)} .c-surf{fill:var(--surface)} .c-panel{fill:var(--panel)} .c-line{fill:var(--line)}
.c-metal{fill:var(--metal)} .c-lip{fill:var(--lip)} .c-acc{fill:var(--accent)}
.c-t1{fill:var(--t1)} .c-t2{fill:var(--t2)} .c-t3{fill:var(--t3)} .c-t4{fill:var(--t4)} .c-t5{fill:var(--t5)} .c-t6{fill:var(--t6)}
.c-ring{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-dasharray:4 5}
.c-label{fill:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.1em}
.c-tag{fill:var(--ink);font-family:var(--sans);font-size:19px;font-weight:700}
.s-t2{fill:none;stroke:var(--t2)}

.preview-band{background:var(--ink);color:var(--bg);font-size:13px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.preview-band a{color:inherit}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.mark{font-family:var(--serif);font-size:24px;line-height:1;letter-spacing:.01em}
.partner{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5),var(--t6));background-size:100vw 100%;transition:width .35s ease}
.app[data-view="intro"] .progress,.app[data-view="end"] .progress{visibility:hidden}

.stage{padding-block:40px 64px}
@media (min-width:760px){.stage{padding-block:64px 88px}}
.col-q{max-width:720px;margin:0 auto}

/* type */
.label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
.label .n{color:var(--accent)}
.q-title{font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance;outline:none}
.q-help{color:var(--ink-2);margin:10px 0 0;max-width:60ch}
.answers{margin-top:28px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
.nav-right{display:flex;align-items:center;gap:16px;margin-left:auto}
.count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.count.warn{color:var(--lip)}

.btn{border:0;cursor:pointer;font-weight:600;font-size:16px;line-height:1;padding:15px 26px;border-radius:8px;transition:opacity .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:disabled{opacity:.3;cursor:not-allowed;transform:none}
.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.text-btn{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:8px 0;font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* option cards with illustrations */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;font-weight:500;font-size:15px;line-height:1.3;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.card svg{width:52px;height:52px;flex:none}
.card small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
.card:hover{border-color:var(--ink-2)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.tick svg{width:12px;height:12px}
[aria-pressed="true"]>.tick{display:grid}
.cards.check{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.cards.check{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cards.check .card{align-items:center;padding:22px 10px}
.cards.check .card svg{width:68px;height:68px}

/* frequency rows */
.rows{display:grid;gap:8px}
.rows .card{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;font-size:16px}
.dots{display:flex;gap:4px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:block}
.dots i.f{background:var(--accent);box-shadow:none}
.dots i.x{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.dots-label{display:block;font-size:12px;color:var(--ink-2);margin-top:5px;text-align:right}

/* choices */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;line-height:1.25;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.stack{flex-direction:column;align-items:stretch}
.chips.stack .chip{padding:15px 18px;font-size:16px}
.group+.group{margin-top:28px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* which best describes you */
.pairs{display:grid;gap:24px}
.pair-q{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair .card{flex-direction:row;align-items:center;gap:14px;padding:14px 40px 14px 14px}
.pair .card>svg{width:60px;height:60px;padding:6px;border-radius:8px;background:var(--panel)}
.pair .card b{display:block;font-size:16px;font-weight:600}
.pair .card small{margin-top:3px}
@media (max-width:540px){.pair .card{flex-direction:column;align-items:flex-start;padding:14px}}

/* price */
.price-read{font-family:var(--serif);font-size:clamp(56px,11vw,88px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.price-read small{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-left:8px}
.range{width:100%;margin:22px 0 10px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,30%),var(--line) var(--p,30%));outline-offset:8px}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 1-5 scale */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;line-height:1.2;text-align:center}
.scale b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

.concept{display:grid;gap:22px;margin-top:24px}
.art{border-radius:12px;overflow:hidden;line-height:0;background:var(--panel)}
.art svg{width:100%;height:auto;display:block}
.concept-card{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
@media (min-width:640px){.concept-card{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
.concept-art{background:var(--panel);line-height:0;display:flex;align-items:center}
.concept-art svg{width:100%;height:auto;display:block}
.concept-body{padding:22px;display:grid;gap:16px;align-content:start}
.concept-name{font-family:var(--serif);font-size:28px;line-height:1.1;margin:0}
.features{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.features li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.features .fi{width:34px;height:34px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.features .fi svg{width:18px;height:18px}
.features b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.features span{display:block;font-size:14px;color:var(--ink-2);line-height:1.4}
.ba{display:flex;align-items:center;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.ba figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ba figure svg{width:58px;height:58px}
.ba .arrow{width:28px;height:14px;color:var(--ink-2);flex:none;margin-bottom:18px}

.field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 17px/1.3 var(--sans)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
textarea.field{min-height:130px;resize:vertical;line-height:1.45}
.stack-gap{display:grid;gap:14px}
.hint{font-size:14px;color:var(--ink-2);margin:8px 0 0}

/* cover */
.intro{display:grid;gap:32px;align-items:center}
@media (min-width:880px){.intro{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:64px}}
.intro-title{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,52px);line-height:1.08;letter-spacing:-.005em;margin:0;text-wrap:balance}
.lede{font-size:17px;max-width:50ch;margin:18px 0 0;color:var(--ink)}
.facts{list-style:none;padding:0;margin:22px 0 26px;display:flex;flex-wrap:wrap;gap:8px}
.facts li{font-size:14px;font-weight:500;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.fine{font-size:13px;color:var(--ink-2);max-width:56ch;margin:18px 0 0}
.sel{user-select:all;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.friend{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 12px}

/* results */
.result{display:grid;gap:28px}
@media (min-width:880px){.result{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px;align-items:start}}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary-head{padding:24px 24px 20px;border-bottom:1px solid var(--line)}
.type-name{font-family:var(--serif);font-size:clamp(34px,5vw,44px);line-height:1.05;margin:4px 0 8px}
.type-line{margin:0;color:var(--ink-2)}
.shade-strip{display:grid;grid-template-columns:repeat(6,1fr);height:8px}
.shade-strip i:nth-child(1){background:var(--t1)}.shade-strip i:nth-child(2){background:var(--t2)}.shade-strip i:nth-child(3){background:var(--t3)}
.shade-strip i:nth-child(4){background:var(--t4)}.shade-strip i:nth-child(5){background:var(--t5)}.shade-strip i:nth-child(6){background:var(--t6)}
.glance{margin:0;padding:8px 24px 16px}
.glance div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding-block:10px;border-bottom:1px solid var(--line);font-size:15px}
.glance div:last-child{border-bottom:0}
.glance dt{color:var(--ink-2)} .glance dd{margin:0;font-weight:500}
.col{display:grid;gap:28px;min-width:0}
.h2{font-weight:600;font-size:21px;line-height:1.25;margin:0 0 10px}
.stats{border-top:1px solid var(--line)}
.stat{display:grid;grid-template-columns:5.2ch 1fr;gap:16px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--line)}
.stat b{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span q{font-style:italic}
.share{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.share p{margin:0 0 14px;max-width:60ch}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.linkbox .field{font-size:14px}
.mini{font-size:14px;color:var(--ink-2);margin:12px 0 0}
.mini b{color:var(--ink)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.board li{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:12px;align-items:center;font-size:15px}
.board .rk{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.board .nm{min-width:0}
.board .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--t3)}
.board li.me .bar i{background:var(--accent)}
.board li.me .nm span{font-weight:600}
.board .n{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.example-note{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--lip);margin:0}

/* link tracker */
.hub{display:grid;gap:26px;max-width:720px;margin:0 auto}
.goal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,40px));gap:10px;margin:16px 0 10px}
.goal-grid i{aspect-ratio:1/1;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.goal-grid i.on{background:var(--accent);box-shadow:none}
.hub-num{font-family:var(--serif);font-size:clamp(48px,8vw,72px);line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.hub-num small{font-family:var(--sans);font-size:16px;color:var(--ink-2);margin-left:6px}
.code-tag{font-weight:600;font-size:14px;letter-spacing:.1em;background:var(--tint);color:var(--ink);padding:6px 10px;border-radius:6px;display:inline-block}

.end{max-width:620px;margin:0 auto;padding-block:20px}
.end h1{font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
.end p{font-size:17px;margin:0 0 14px}

.foot{border-top:1px solid var(--line);color:var(--ink-2);font-size:13px;background:var(--surface)}
.foot .wrap{padding-block:18px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app" data-view="intro">
  <div class="preview-band" id="previewBand" hidden>
    <span>Preview: answers aren’t saved, and the numbers shown are examples.</span>
    <span><a href="#hub" id="hubLinkPreview">See the link tracker</a> · <a href="#" id="restartPreview">Start over</a></span>
  </div>
  <header class="top">
    <div class="wrap top-in">
      <span class="mark">Face Value</span>
      <span class="partner">GCDS × L’Oréal Luxe</span>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  </header>
  <main class="wrap stage">
    <section id="screen" aria-live="polite"></section>
  </main>
  <footer class="foot">
    <div class="wrap">
      <span>A Greenwich Country Day School student research project in partnership with L’Oréal Luxe. Not an official L’Oréal website.</span>
      <span id="footContact"></span>
    </div>
  </footer>
</div>
<script>
(function () {
  'use strict';

  /* ---------- setup ---------- */
  var API = (window.FACE_VALUE_API || '').trim();
  var GAS = !!(window.google && google.script && google.script.run);
  var LIVE = !!API || GAS;
  var S = { open: true, contactEmail: '', sharerGoal: 10, ambassadorGoal: 25, sharerLimit: 20 };
  var params = {};
  try { new URLSearchParams(location.search).forEach(function (v, k) { params[k] = v; }); } catch (e) { }
  var REF = LIVE ? cleanCode(params.ref) : '';
  var HUB = LIVE ? cleanCode(params.hub) : '';
  var refInfo = null, knownSchools = [];

  var app = document.getElementById('app');
  var screen = document.getElementById('screen');
  var bar = document.getElementById('bar');
  var A = {}, trail = [], t0 = 0, rid = '';

  function cleanCode(c) { c = String(c || '').trim().toUpperCase(); return /^[A-Z0-9-]{3,24}$/.test(c) ? c : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function has(v, x) { return Array.isArray(v) && v.indexOf(x) !== -1; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function randId(n) { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', b = new Uint32Array(n); window.crypto.getRandomValues(b); for (var i = 0; i < n; i++) s += c[b[i] % c.length]; return s; }
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };
  function siteUrl() { return location.origin + location.pathname; }

    return '<ol class="board">' + list.map(function (r, i) {
      var me = mine && schoolKey(mine) === schoolKey(r.school);
      return '<li class="' + (me ? 'me' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="nm"><span>' + esc(r.school) + (me ? ' (your school)' : '') + '</span><span class="bar"><i style="width:' + Math.max(4, Math.round(r.n / max * 100)) + '%"></i></span></span><span class="n">' + r.n + '</span></li>';
    }).join('') + '</ol>';
  }
  function shareBox(young) {
    if (young) {
      return '<div class="share"><h2 class="h2">Share the survey</h2><p>The more people who answer, the better our results. Send this link to friends.</p>' +
        '<div class="linkbox"><input class="field" id="linkOut" readonly value="' + esc(linkFor('')) + '" aria-label="Survey link"><button class="btn secondary" id="copyLink">Copy</button></div></div>';
    }
    return '<div class="share">' +
      '<h2 class="h2">Share it and earn a L’Oréal gift box</h2>' +
      '<p>Get your own link. When ' + S.sharerGoal + ' people finish the survey from your link, you can claim a L’Oréal gift box. Gifts go to the first ' + S.sharerLimit + ' people to reach ' + S.sharerGoal + ', and we check every count before anything ships.</p>' +
      '<div id="shareInner"><button class="btn primary" id="makeLink">Get my link</button></div>' +
    '</div>';
  }
  function bindShare(young) {
    if (young) return copyable('copyLink', 'linkOut');
    var saved = LIVE ? store.get('fv_code') : null;
    if (saved && saved.code) return showLink(saved);
    var b = document.getElementById('makeLink');
    if (!b) return;
    b.addEventListener('click', function () {
      b.disabled = true; b.textContent = 'Creating your link…';
      api('createCode', A.school && A.school !== 'Not given' ? A.school : '').then(function (r) {
        if (!r || !r.code) throw new Error('no code');
        if (LIVE) store.set('fv_code', { code: r.code, goal: r.goal });
        showLink(r);
      }).catch(function () { b.disabled = false; b.textContent = 'Try again'; });
    });
  }
  function showLink(r) {
    var inner = document.getElementById('shareInner'); if (!inner) return;
    inner.innerHTML =
      '<div class="linkbox"><input class="field" id="linkOut" readonly value="' + esc(linkFor(r.code)) + '" aria-label="Your share link"><button class="btn secondary" id="copyLink">Copy</button></div>' +
      '<p class="mini">Your code is <b>' + esc(r.code) + '</b>. Keep it, because you’ll need it to claim your gift. Track your progress at <span class="sel">' + esc(linkFor(r.code, 'hub')) + '</span></p>' +
      (S.contactEmail ? '<p class="mini">Reached ' + (r.goal || S.sharerGoal) + '? Email <span class="sel">' + esc(S.contactEmail) + '</span> with your code.</p>' : '');
    copyable('copyLink', 'linkOut');
  }
  function copyable(btnId, inputId) {
    var btn = document.getElementById(btnId), inp = document.getElementById(inputId);
    if (!btn || !inp) return;
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1600); };
      var fallback = function () { inp.focus(); inp.select(); btn.textContent = 'Selected'; };
      try { navigator.clipboard.writeText(inp.value).then(done, fallback); } catch (e) { fallback(); }
    });
  }

  function renderResult(res, t, a) {
    setView('result'); progress(true);
    var young = a.age === 'Under 13';
    var stats = '';
    if (res.responseNumber) stats += '<div class="stat"><b>' + res.responseNumber + '</b><span>responses so far, including yours.</span></div>';
    if (res.school && res.school.rank) stats += '<div class="stat"><b>#' + res.school.rank + '</b><span>' + esc(res.school.name) + ' ranks ' + res.school.rank + ' of ' + res.school.of + ' schools, with ' + res.school.count + ' responses.</span></div>';
    else if (res.school) stats += '<div class="stat"><b>' + res.school.count + '</b><span>' + (res.school.count === 1 ? 'response' : 'responses') + ' from ' + esc(res.school.name) + ' so far.' + (res.school.needed ? ' ' + res.school.needed + ' more puts your school on the leaderboard.' : '') + '</span></div>';
    var c = res.compare || {};
    if (c.freq != null) stats += '<div class="stat"><b>' + c.freq + '%</b><span>of people also answered <q>' + esc(a.freq) + '</q>.</span></div>';
    if (c.hero != null && a.w_hero) stats += '<div class="stat"><b>' + c.hero + '%</b><span>of people who wear makeup would also keep ' + esc(short(a.w_hero)) + '.</span></div>';
    if (c.concept != null) stats += '<div class="stat"><b>' + c.concept + '%</b><span>would probably or definitely try the concealer stick. You said <q>' + esc(SCALE[(a.concept_try || 1) - 1]) + '</q>.</span></div>';

    screen.innerHTML = '<div class="result fade">' +
      '<div class="col">' + summaryCard(t, glance(a), res.responseNumber) + '</div>' +
      '<div class="col">' +
        '<div><p class="label">Thank you</p><h1 class="q-title">How your answers compare</h1></div>' +
        (res.example ? '<p class="example-note">Example numbers (preview)</p>' : '') +
        '<div class="stats">' + stats + '</div>' +
        shareBox(young) +
        '<div><h2 class="h2">Responses by school</h2>' + boardHtml(res.leaderboard, a.school) + '</div>' +
      '</div></div>';
    bindShare(young);
    toTop();
  }

  /* ---------- link tracker ---------- */
  function renderHub(code) {
    setView('result'); progress(true);
    screen.innerHTML = '<div class="hub"><p class="label">Link tracker</p><h1 class="q-title">Checking your link…</h1></div>';
    Promise.all([api('getCodeStats', code), api('getLeaderboard')]).then(function (rs) {
      var r = rs[0] || {}, b = rs[1] || {};
      if (!r.found) return hubLookup(code);
      var goal = r.goal || S.sharerGoal, done = r.done || 0, left = Math.max(0, goal - done);
      var cells = ''; for (var i = 0; i < goal; i++) cells += '<i class="' + (i < done ? 'on' : '') + '"></i>';
      var msg;
      if (done >= goal) msg = 'You reached your goal. Email ' + (S.contactEmail ? '<span class="sel">' + esc(S.contactEmail) + '</span>' : 'the team') + ' with your code to claim your gift. We’ll check the count first.';
      else if (r.type !== 'Ambassador' && r.sharerSpotsLeft === 0) msg = 'All the gift boxes for shared links have been claimed. Responses from your link still count toward your school’s total.';
      else msg = left + ' more to go.' + (r.type !== 'Ambassador' && r.sharerSpotsLeft != null ? ' ' + r.sharerSpotsLeft + ' of ' + S.sharerLimit + ' gift boxes are still available.' : '');
      screen.innerHTML = '<div class="hub fade">' +
        '<div><p class="label">Link tracker' + (r.type === 'Ambassador' ? ' · Ambassador' : '') + '</p>' +
        '<span class="code-tag">' + esc(r.code) + '</span>' +
        '<p class="hub-num">' + done + '<small>of ' + goal + ' finished</small></p>' +
        (r.example ? '<p class="example-note">Example numbers (preview)</p>' : '') +
        '<div class="goal-grid" aria-hidden="true">' + cells + '</div>' +
        '<p>' + msg + '</p></div>' +
        '<div class="share"><h2 class="h2">Your link</h2><div class="linkbox"><input class="field" id="hubLinkOut" readonly value="' + esc(linkFor(r.code)) + '" aria-label="Your share link"><button class="btn secondary" id="hubCopy">Copy</button></div><p class="mini">Only completed surveys count, and each one is checked before gifts ship.</p></div>' +
        '<div><h2 class="h2">Responses by school</h2>' + boardHtml(b.leaderboard, r.school) + '</div>' +
      '</div>';
      copyable('hubCopy', 'hubLinkOut');
    }, function () { hubLookup(code, true); });
    toTop();
  }
  function hubLookup(code, failed) {
    screen.innerHTML = '<div class="hub"><p class="label">Link tracker</p><h1 class="q-title">' + (failed ? 'We couldn’t load that code.' : code ? 'We couldn’t find that code.' : 'Check your link') + '</h1>' +
      '<p class="q-help">Enter the code from your link. It looks like PLUM-7K2.</p>' +
      '<div class="linkbox"><input class="field" id="codeIn" maxlength="24" autocomplete="off" value="' + esc(code || '') + '" aria-label="Your code"><button class="btn primary" id="codeGo">Check</button></div></div>';
    document.getElementById('codeGo').addEventListener('click', function () { var v = cleanCode(document.getElementById('codeIn').value); if (v) renderHub(v); });
  }

  /* ---------- other screens ---------- */
  function renderEnd(kind) {
    setView('end');
    if (kind === 'closed') screen.innerHTML = '<div class="end fade"><h1>This survey is closed.</h1><p>Thank you to everyone who took part. The results are going into our class presentation.</p></div>';
    toTop();
  }
  function renderDone(saved) {
    setView('result'); progress(true);
    var t = TYPES[saved.type] ? { name: TYPES[saved.type][0], line: TYPES[saved.type][1] } : { name: 'Thank you', line: '' };
    screen.innerHTML = '<div class="result fade"><div class="col">' + summaryCard(t, saved.glance || [], saved.n) + '</div><div class="col">' +
      '<div><p class="label">Already completed</p><h1 class="q-title">You’ve already taken this survey on this device.</h1><p class="q-help">One response per person keeps the results accurate. You can still share it.</p></div>' +
      shareBox(saved.young) + '<div id="doneBoard"></div></div></div>';
    bindShare(saved.young);
    api('getLeaderboard').then(function (b) { var el = document.getElementById('doneBoard'); if (el) el.innerHTML = '<h2 class="h2">Responses by school</h2>' + boardHtml(b && b.leaderboard); }, function () { });
  }
  function applySettings(boot) {
    if (!boot) return;
    if (boot.settings) Object.keys(boot.settings).forEach(function (k) { if (boot.settings[k] !== '' && boot.settings[k] != null) S[k] = boot.settings[k]; });
    refInfo = boot.refInfo || null;
    knownSchools = boot.schools || [];
    if (S.contactEmail) document.getElementById('footContact').innerHTML = 'Questions: <span class="sel">' + esc(S.contactEmail) + '</span>';
  }

  /* ---------- start ---------- */
  function route() {
    if (HUB) return renderHub(HUB);
    if (!LIVE && location.hash === '#hub') return renderHub('PLUM-7K2');
    if (!S.open) return renderEnd('closed');
    if (LIVE && store.get('fv_done')) return renderDone(store.get('fv_done'));
    renderIntro();
  }
  if (!LIVE) {
    document.getElementById('previewBand').hidden = false;
    document.getElementById('restartPreview').addEventListener('click', function (e) { e.preventDefault(); if (location.hash) location.hash = ''; renderIntro(); });
    window.addEventListener('hashchange', function () { if (location.hash === '#hub') renderHub('PLUM-7K2'); else renderIntro(); });
    route();
  } else if (window.BOOT) {
    applySettings(window.BOOT); route();
  } else {
    route();
    api('getBoot', REF).then(function (boot) {
      applySettings(boot);
      if (app.dataset.view === 'intro') route();       // refresh the cover with the referral line and settings
      else if (!S.open && !trail.length) renderEnd('closed');
    }, function () { });
  }

  window.__fv = { collect: collect, shown: function () { return shown().map(function (q) { return q.id; }); } };
})();
</script>
</body>
</html>
